[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    ml: marks tests that require ML libraries

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
    ignore::ImportWarning
    ignore::ResourceWarning
    ignore::RuntimeWarning
    ignore::SyntaxWarning
    ignore::Warning
    ignore::UnicodeWarning
    ignore::BytesWarning
    ignore::ImportWarning:some_module
    ignore::SomeSpecificWarning
    ignore::AnotherSpecificWarning:another_module
    ignore::YetAnotherWarning:yet_another_module
    ignore::CustomWarning:custom_module
    ignore::SomeOtherWarning:some_other_module
    ignore::SpecificWarning:specific_module

    [tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]unit: marks tests as unit tests