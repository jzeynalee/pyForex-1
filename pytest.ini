# pytest.ini
[pytest]
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may be slower)
    slow: Slow tests (performance benchmarks)
    mt5: Tests requiring MT5 connection

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Speed optimizations
addopts = 
    -m "unit and not slow"
    -n auto
    --tb=short
    --no-header
    -q

# Disable coverage during fast runs (add --cov when needed)
# Don't collect slow tests by default